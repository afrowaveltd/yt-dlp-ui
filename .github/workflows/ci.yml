name: build-and-package

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build
        run: dotnet build YtDlpUi.slnx -c Release
      - name: Smoke tests
        run: dotnet run --project tests/YtDlpUi.SmokeTests/YtDlpUi.SmokeTests.csproj -c Release --no-build
      - name: Debian package
        if: runner.os == 'Linux'
        run: |
          ./scripts/package-deb.sh
          dpkg-deb --info artifacts/*.deb
          dpkg-deb --contents artifacts/*.deb | grep 'usr/bin/yt-dlp-gui'
          dpkg-deb --contents artifacts/*.deb | grep 'opt/yt-dlp-gui/Locales/en.json'
      - name: Upload Debian package
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: yt-dlp-gui-deb
          path: artifacts/*.deb
          if-no-files-found: error
      - name: Build portable Linux archive
        if: runner.os == 'Linux'
        run: |
          ./scripts/package-linux-tar.sh --from-publish
          tar -tzf artifacts/*linux-*.tar.gz | grep 'yt-dlp-gui/yt-dlp-gui'
      - name: Install RPM build tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm
      - name: Build RPM package
        if: runner.os == 'Linux'
        run: |
          ./scripts/package-rpm.sh --from-publish
          rpm -qpi artifacts/*.rpm
          rpm -qpl artifacts/*.rpm | grep '/usr/bin/yt-dlp-gui'
      - name: Upload other Linux packages
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: yt-dlp-gui-linux-rpm-tar
          path: |
            artifacts/*.rpm
            artifacts/*.tar.gz
          if-no-files-found: error
      - name: Windows portable release
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./scripts/build-windows.ps1
          if (-not (Test-Path 'publish/win-x64/yt-dlp-gui.exe')) { throw 'Missing Windows binary' }
          if (-not (Test-Path 'publish/win-x64/Locales/en.json')) { throw 'Missing bundled locale files' }
      - name: Upload Windows portable build
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: yt-dlp-gui-windows-x64
          path: publish/win-x64/
          if-no-files-found: error
      - name: Install Inno Setup
        if: runner.os == 'Windows'
        shell: pwsh
        run: choco install innosetup --no-progress -y
      - name: Windows setup wizard
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./scripts/build-windows-installer.ps1 -FromPublish
          if (-not (Get-ChildItem artifacts/yt-dlp-gui-setup-*.exe -ErrorAction SilentlyContinue)) {
            throw 'Missing setup executable'
          }
      - name: Upload Windows setup wizard
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: yt-dlp-gui-windows-setup
          path: artifacts/yt-dlp-gui-setup-*.exe
          if-no-files-found: error
