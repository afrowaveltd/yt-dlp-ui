name: Android prototype APK

on:
  push:
    branches: ['feature/android-*']
  pull_request:
    paths:
      - 'src/YtDlpUi.Android/**'
      - 'src/YtDlpUi.Core/**'
      - 'YtDlpUi.Android.slnx'
      - '.github/workflows/android-preview.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-debug-apk:
    name: Build Android debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Install Android .NET workload
        run: dotnet workload install android
      - name: Install Android SDK platform
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"
      - name: Compile APK
        run: dotnet build YtDlpUi.Android.slnx -c Debug -p:AndroidPackageFormat=apk
      - name: Confirm APK output
        run: |
          find src/YtDlpUi.Android/bin/Debug -name '*.apk' -print
          test "$(find src/YtDlpUi.Android/bin/Debug -name '*.apk' | wc -l)" -ge 1
      - name: Upload development-only Android APK
        uses: actions/upload-artifact@v4
        with:
          name: afrowave-android-prototype-debug
          path: src/YtDlpUi.Android/bin/Debug/**/*.apk
          if-no-files-found: error
